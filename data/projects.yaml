# awesome-open-embodied-robotics — project data (single source of truth)
#
# Edit this file, then run:  python scripts/generate_readme.py
# This generates README.md, README.zh-CN.md, and categories/<id>/README.md + README.zh-CN.md.
# Schema: data/schema.md and data/schema.json
#
# Conventions:
# - Use the literal string "Unknown" when a fact was not found. Do not invent values.
# - Hardware and software licenses are recorded separately, from LICENSE files or official statements.
# - repo_last_commit is stored in UTC (suffix Z). READMEs display Asia/Shanghai.
# - Within a category, the generator sorts projects alphabetically by English `name`.
# - cereboto_related / disclosure must be set when Cereboto sells or officially partners on a project.
# - purchase_channels list only an official shop or an official purchase page, plus a Cereboto
#   product page when Cereboto actually sells the product (with a "Disclosure: sold by Cereboto"
#   disclosure). Do not list GitHub links (BOM, parts tables, CAD, or repositories), official
#   documentation that is not a purchase page, or third-party, peer, or competitor vendors.
#   If no allowed channel remains, set the field to Unknown.
# - verification_status: official_verified | community_verified | source_checked | unverified
# - image_url is an official photo, render, or documented image. image_source is the page it came from.
#   Use Unknown for both when no official image was found. Do not generate images.
#
schema_version: '1.0'
as_of: '2026-11-20'
as_of_timezone: Asia/Shanghai
directory:
  title: Awesome Open Embodied Robotics
  maintainer: Cereboto
  maintainer_url: https://cereboto.com/
  tagline_en: An independent, community-driven directory of open-source embodied robotics projects, maintained
    by Cereboto to help developers discover, compare, and build the next generation of intelligent robots.
  tagline_zh: 一份独立、由社区驱动的开源具身机器人项目目录，由 Cereboto 维护，帮助开发者发现、比较并动手制作下一代智能机器人。
  ranking_rule: alphabetical_by_english_name
  commercial_partnerships_do_not_affect_ranking: true
  no_brand_excluded_for_competitive_reasons: true
verification_levels:
- id: official_verified
  title_en: Official verified
  title_zh: 官方核实
  definition_en: A maintainer or official organization of the project has confirmed this directory entry
    (for example by commenting on a tracking issue or submitting a confirmation pull request). None of
    the first-draft entries have this status.
  definition_zh: 该项目的维护者或官方机构已确认本目录条目（例如在跟踪 issue 中回复，或提交确认用的 Pull Request）。本初稿中的条目都还没有这一状态。
- id: community_verified
  title_en: Community verified
  title_zh: 社区核实
  definition_en: An independent contributor has checked the entry against a physical build, or has provided
    dated evidence that goes beyond reading public pages. None of the first-draft entries have this status.
  definition_zh: 有独立贡献者对照实物复现核查了该条目，或提供了超出阅读公开页面的、带日期的证据。本初稿中的条目都还没有这一状态。
- id: source_checked
  title_en: Source-checked
  title_zh: 已对源核查
  definition_en: Maintainers of this directory have checked the listed claims against public primary sources
    (official repository, documentation, or vendor pages) on the stated as-of date. This is not confirmation
    by the project maintainer, and it is not a reproduction of the hardware.
  definition_zh: 本目录维护者已在标注的截止日期，对照公开的一手来源（官方仓库、文档或商家页面）核对所列信息。这不等于项目维护者确认，也不等于已经复现硬件。
- id: unverified
  title_en: Unverified
  title_zh: 未核实
  definition_en: The entry is newly submitted, or key claims (including whether design files are publicly
    released) could not be confirmed from public primary sources.
  definition_zh: 条目为新提交，或关键信息（包括设计文件是否已公开）无法从公开一手来源确认。
categories:
- id: manipulators
  title: Single-arm / dual-arm manipulators
  title_zh: 单臂 / 双臂机械臂
  comparison_en: This first batch covers three very different layers of the arm stack. SO-101 is a low-cost,
    3D-printed follower/leader arm built around Feetech STS3215 bus servos and the LeRobot software stack.
    SO-ARM 102, maintained by Robonine, is a successor to SO-ARM 100 and SO-101 in that same low-cost
    leader–follower layer, built to work with LeRobot. Each arm has five degrees of freedom plus a parallel
    gripper (85 mm span), a rated payload of 300 g, and a horizontal reach of 483 mm (473 mm behind the
    base). The official DIY budget is about USD 342 for components, or about USD 388 including printing
    material. Hardware designs are CERN-OHL-P-2.0 and software is Apache-2.0. The GitHub license API
    reports the repository as CC-BY-4.0, which is the documentation license. OpenArm is a human-scale
    7-DoF-per-arm quasi-direct-drive platform with a CAN-FD control bus, a stated complete bimanual system
    price on the order of USD 6,500, and a clearly split license (CERN-OHL-S-2.0 hardware, Apache-2.0
    software). DexWrist is a 2-DoF research wrist intended as a drop-in pitch–yaw upgrade, but as of the
    source-check date we could not find a public CAD or firmware repository, so its open-source status is
    unconfirmed.
  comparison_zh: 这一批机械臂其实处在三个不同层。SO-101 是围绕飞特 STS3215 总线舵机和 LeRobot 软件栈的低成本 3D 打印主从臂。SO-ARM 102
    由 Robonine 维护，是同一低成本主从层中 SO-ARM 100 与 SO-101 的后继型号，可与 LeRobot 配合使用。每臂 5 自由度外加平行夹爪（跨度 85 毫米），额定负载
    300 克，水平伸展 483 毫米（底座后方 473 毫米）。官方 DIY 预算约为零件 342 美元，或含打印材料约 388 美元。硬件设计为 CERN-OHL-P-2.0，软件为
    Apache-2.0。GitHub 许可证 API 将仓库显示为 CC-BY-4.0，对应文档许可。OpenArm
    是人体尺度、每臂 7 自由度的准直驱平台，控制总线为 CAN-FD，官方README 给出完整双臂系统约 6,500 美元，许可证划分清楚（硬件 CERN-OHL-S-2.0，软件 Apache-2.0）。DexWrist
    是 2 自由度研究用腕部，定位为可替换的俯仰-偏航关节；但在本次对源核查之日，我们没有找到公开的 CAD 或固件仓库，开源状态尚未确认。
- id: humanoids
  title: Humanoids
  title_zh: 人形机器人
  comparison_en: All four are presented as open humanoid platforms, but they differ in cost band, license,
    and completeness. Berkeley Humanoid Lite emphasizes a sub-USD 5,000, largely 3D-printed build with
    MIT-licensed code and CC BY-SA 4.0 assets, plus Isaac Lab support. ToddlerBot is a smaller loco-manipulation
    research humanoid (30 active DoF in official materials) with MIT-licensed code and a non-commercial
    CC BY-NC-SA design license; the project paper states a build cost under USD 6,000. Poppy Humanoid
    is the oldest educational/research platform here (25 Dynamixel actuators, official BOM about USD 8,000–9,000)
    and uses CC BY-SA 4.0 hardware with GPL-3.0 software; the main CAD repo has not been committed to
    since 2021. Fourier N1 is a 23-DoF, 1.3 m / 38 kg industrial-origin open release with official hardware
    downloads, but the hardware license was not located, and the public GitHub side is documentation and
    SDK-related repositories rather than a single monorepo.
  comparison_zh: 四款都被定位为开放人形平台，但价位、许可证和完整程度差别很大。Berkeley Humanoid Lite 强调低于 5,000 美元、以 3D 打印为主的可复现方案，代码
    MIT、资源 CC BY-SA 4.0，并支持 Isaac Lab。ToddlerBot 是更小型的运动-操作研究平台（官方材料为 30 个主动自由度），代码 MIT，设计文件为非商业性的 CC
    BY-NC-SA；项目论文写明建造成本低于 6,000 美元。Poppy Humanoid 是这里历史最长的教育/研究平台（25 个 Dynamixel 执行器，官方 BOM 约 8,000–9,000
    美元），硬件 CC BY-SA 4.0、软件 GPL-3.0；主 CAD 仓库自 2021 年以来没有新的提交。Fourier N1 是 23 自由度、身高 1.3 米、体重 38 公斤的工业背景开源发布，官方提供硬件下载，但我们没有找到硬件许可证；公开
    GitHub 一侧主要是文档和 SDK 相关仓库，而不是单一的单体仓库。
- id: mobile_manipulators
  title: Mobile manipulators
  title_zh: 移动操作机器人
  comparison_en: Cost and arm choice dominate the differences. XLeRobot is explicitly a dual SO-101 plus
    omni-wheel home robot; the official README gives a basic BOM around USD 660 (excluding printing, tools,
    shipping, and tax) and sits in the LeRobot ecosystem. AhaRobot is a low-cost bimanual mobile manipulator
    from Tianjin University, with Feetech actuation and GPL-3.0 hardware and software repositories; an
    official single-number BOM was not confirmed in the pages we opened. TidyBot++ is a holonomic swerve-drive
    research mobile base (Kraken X60 / CAN) designed to carry interchangeable arms (Kinova, Franka, or
    ARX5 in the official BOM). The official Kinova-tab mobile-base total is USD 5,379.63, not including
    the arm itself, so a complete system price depends on which arm you mount.
  comparison_zh: 这三款的主要差别在成本和所搭配的手臂。XLeRobot 明确是双 SO-101 加全向轮的家用操作机器人，官方 README 给出基础 BOM 约 660 美元（不含打印、工具、运费和税），并处于
    LeRobot 生态中。AhaRobot 是天津大学的低成本双臂移动操作平台，使用飞特舵机，软硬件仓库均为 GPL-3.0；我们打开的官方页面里没有确认到一个单独的 BOM 总价。TidyBot++
    是全向转向（swerve）研究用移动底座（Kraken X60 / CAN），官方 BOM 支持更换 Kinova、Franka 或 ARX5 手臂。Kinova 分页上移动底座合计为 5,379.63
    美元，不包括手臂本身，整机价格取决于所选手臂。
- id: legged
  title: Quadruped / legged
  title_zh: 四足 / 腿式机器人
  comparison_en: 'None of the four entries in this first batch is a classic quadruped; all are bipeds
    or wheeled-leg machines, recategorized from the source site''s mixed ''biped'' bucket. Open Duck Mini
    is a desktop-scale (~42 cm) biped whose official hub repository states a full BOM under USD 400 and
    uses Feetech STS3215 servos under Apache-2.0. Unitree Qmini is a 3D-printable biped with 11 Unitree
    8010 motors and a Raspberry Pi 4B reference computer; the official repo is CC BY-NC-SA 4.0, and a
    total BOM price was not found. AlexbotMini is a Fourier-sponsored 1.2 m-class biped (source and README:
    700 mm lower body + 500 mm upper body) whose hardware repo is BSD-3-Clause; a public BOM total was
    not confirmed. The Micro Wheeled-leg Robot is a desktop two-wheeled-leg design with an ESP32 controller,
    Feetech bus servos in the legs, and FOC wheel motors; no LICENSE file was found in the repository.'
  comparison_zh: 这一批里其实没有经典四足，全部是双足或轮腿，是从源网站的「双足机器人」分类改归到本类的。Open Duck Mini 是桌面尺度（约 42 厘米）双足，官方枢纽仓库写明完整
    BOM 低于 400 美元，使用飞特 STS3215，许可证为 Apache-2.0。宇树 Qmini 是可 3D 打印双足，使用 11 个宇树 8010 电机，参考主控为树莓派 4B；官方仓库为
    CC BY-NC-SA 4.0，没有找到 BOM 总价。AlexbotMini 是傅利叶赞助的约 1.2 米级双足（README：下半身 700 毫米、上半身 500 毫米），硬件仓库为 BSD-3-Clause；未确认到公开的
    BOM 总价。桌面轮足机器人是桌面级双轮腿设计，主控 ESP32，腿部为飞特总线舵机，轮部为 FOC 无刷电机；仓库中没有找到 LICENSE 文件。
- id: hands_grippers
  title: Dexterous hands & grippers
  title_zh: 灵巧手与夹爪
  comparison_en: 'This is the largest category in the first batch. Low-cost 3D-printed tendon or hybrid
    hands (LEAP Hand v2 at a stated ~USD 200 class, with an official August 2025 parts split of USD 221.95
    Feetech + USD 251.53 other; Robot Nano Hand; DexHand) sit beside Dynamixel-based research hands (LEAP
    Hand v1, RUKA, ORCA, LEAP Hand v2 Advanced). Licenses are not uniform: several LEAP releases use non-commercial
    Creative Commons terms on CAD or even on the v1 API, while ORCA hardware is CC BY 4.0 (including commercial
    use with attribution) and RUKA''s repo is MIT. eFlesh and FreeTacMan are tactile sensing systems rather
    than complete hands; they are kept here because they are usually used with dexterous manipulation,
    with their type marked in the data file. Dextra is a much older Hackaday-era design; several fields
    remain Unknown.'
  comparison_zh: 这是第一批里条目最多的一类。低成本 3D 打印腱传动或刚软混合手（LEAP Hand v2 官方定位约 200 美元量级，2025 年 8 月零件表为飞特 221.95
    美元 + 其他 251.53 美元；以及 Robot Nano Hand、DexHand）与基于 Dynamixel 的研究用手（LEAP Hand v1、RUKA、ORCA、LEAP Hand
    v2 Advanced）并列。许可证并不统一：多个 LEAP 版本的 CAD 或甚至 v1 API 使用非商业性 Creative Commons，而 ORCA 硬件为允许商业使用的 CC BY
    4.0（需署名），RUKA 仓库为 MIT。eFlesh 和 FreeTacMan 是触觉传感系统而不是完整的手，因为它们通常配合灵巧操作使用而放在本类，并在数据文件中标注了类型。Dextra 是更早期的
    Hackaday 设计，不少字段仍为「未知」。
- id: teleop_data
  title: Teleoperation & data-collection devices
  title_zh: 遥操作与数据采集装置
  comparison_en: 'GELLO, JoyLo, and OpenHomie are leader-side or isomorphic teleoperation systems, mostly
    Dynamixel-based, for collecting manipulation data. GELLO publishes both software and mechanical repositories
    under MIT. OpenHomie''s LICENSE file is CC BY-NC 4.0, while its README states CC BY-NC-SA 4.0 — both
    are recorded. DOGlove is a haptic force-feedback glove (official materials: 5 DoF, Dynamixel, MIT-licensed
    repo; the source site listed CNY-like 4500, which was not used). DexUMI uses the human hand as the
    manipulation interface for dexterous data collection (MIT-licensed software). Specialist is a UMI-style
    handheld and actuated gripper for collecting robot training data. The official site lists USD 320 per
    handheld gripper and USD 380 per actuated gripper. The software license is MIT. A separate official
    hardware-design license was not identified, so the hardware license is Unknown. ViA (Vision in Action)
    was listed as a wheeled robot on the source site, but official materials describe an active-perception
    stack whose public hardware focus is a robotic neck, used with ARX arms and ROS; it is placed here
    as data-collection / active-perception hardware, not as a mobile manipulator.'
  comparison_zh: GELLO、JoyLo 和 OpenHomie 是用于采集操作数据的主动端或同构遥操作系统，大多基于 Dynamixel。GELLO 的软件与机械仓库均为 MIT。OpenHomie
    的 LICENSE 文件是 CC BY-NC 4.0，但其 README 写的是 CC BY-NC-SA 4.0——两者都照实记录。DOGlove 是力反馈手套（官方材料：5 自由度、Dynamixel，仓库
    MIT；源网站列出的 4500 未写明币种，本目录未采用该数字）。DexUMI 把人手当作灵巧操作的数据采集接口（软件 MIT）。Specialist 是面向采集机器人训练数据的 UMI 式手持与主动夹爪。官方网站列出的成本为每个手持夹爪 320 美元、每个主动夹爪 380 美元。软件许可证为 MIT。没有找到单独的官方硬件设计许可证，因此硬件许可证记为「未知」。ViA（Vision in Action）在源网站被标成轮式机器人，但官方材料描述的是主动感知系统，公开硬件重点是机器人颈部，并与
    ARX 机械臂和 ROS 配合；因此放到本类，而不是移动操作机器人。
- id: desktop_educational
  title: Desktop / educational robots
  title_zh: 桌面 / 教育机器人
  comparison_en: OttoDIY is a long-running 3D-printed educational walker; the official Arduino library
    is GPL-3.0, and a separate hardware license file was not confirmed. EchoEar (喵伴 / ESP-VoCat) is a
    desktop AI companion with a touch screen, not a manipulator, released on an open-hardware platform
    that lists GPL-3.0; the broader ESP-Brookesia framework is Apache-2.0 according to GitHub's license
    badge, but a LICENSE file was not found at the repository root paths we tried. Morpheus is a 33-actuator
    animatronic face (Raspberry Pi 5 in official materials) with MIT-licensed hardware and software repositories;
    it is not a mobile or manipulation robot, but it is open embodied hardware, so it is kept in this
    educational / desktop bucket rather than forced into humanoids.
  comparison_zh: OttoDIY 是历史较长的 3D 打印教育行走机器人；官方 Arduino 库为 GPL-3.0，我们没有另外确认到独立的硬件许可证文件。EchoEar（喵伴 / ESP-VoCat）是带触摸屏的桌面
    AI 陪伴设备，不是机械臂；开源硬件平台标注 GPL-3.0。更大的 ESP-Brookesia 框架在 GitHub 许可证徽章上显示为 Apache-2.0，但我们尝试的仓库根路径下没有找到
    LICENSE 文件。Morpheus 是 33 个执行器的仿生表情脸（官方材料为树莓派 5），软硬件仓库均为 MIT；它不是移动或操作机器人，但是开源具身硬件，因此放在桌面/教育类，而不是强行归入人形机器人。
