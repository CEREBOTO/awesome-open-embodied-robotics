name: Correction
description: Fix a fact, license, cost, link, or category in an existing entry
title: "[Correction] "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Please quote the current text, the proposed text, and a primary source URL. See [CONTRIBUTING.md](../../CONTRIBUTING.md).
  - type: input
    id: project
    attributes:
      label: Project name
    validations:
      required: true
  - type: input
    id: field
    attributes:
      label: Field to correct
      description: For example license, BOM cost, last commit, category, purchase channels.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed text
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary source URL
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else we should know
